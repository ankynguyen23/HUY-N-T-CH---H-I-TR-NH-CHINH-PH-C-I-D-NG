<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Hải Trình Đại Chinh Phục</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* ĐƯỜNG DẪN ẢNH NỀN: Tự động nhận file ảnh tên banner.png bạn vừa up lên GitHub cùng thư mục */
            background: url('banner.png') no-repeat center center fixed; 
            background-size: cover; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        /* Hiệu ứng hộp kính mờ đè lên ảnh nền hải tặc */
        .box { 
            background: rgba(13, 17, 39, 0.75); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #00c3ff;
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.4); 
            text-align: center; 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { color: #00c3ff; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 195, 255, 0.5); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #00c3ff; background: rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-size: 16px; text-align: center; outline: none; }
        input::placeholder { color: #aaa; }
        button { width: 100%; padding: 12px; background: #00c3ff; color: #0d1127; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #0088cc; box-shadow: 0 0 15px #00c3ff; }
        
        /* Giao diện bức thư ẩn phong cách hải tặc cổ điển */
        #content { display: none; width: 100%; max-width: 600px; margin: 20px; }
        .letter { background: #f4ecd8; border: 3px double #5c4033; border-radius: 8px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .letter::before { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 1px dashed #c3a37a; pointer-events: none; }
        .letter-title { font-family: 'Georgia', serif; font-size: 26px; color: #5c4033; margin-bottom: 25px; text-align: center; font-weight: bold; border-bottom: 2px dashed #c3a37a; padding-bottom: 10px; }
        .letter-text { font-family: 'Georgia', serif; font-size: 19px; color: #4a3525; line-height: 1.9; text-align: justify; font-style: italic; }
    </style>
</head>
<body>

    <!-- Màn hình khóa với hình nền Hải Tặc -->
    <div class="box" id="lock-screen">
        <h2>🏴‍☠️ HỒI KẾT</h2>
        <input type="text" id="password" placeholder="Nhập tọa độ để về đích...">
        <button onclick="check()">Xác Thực</button>
        <p id="error" style="color:#ff4a4a; margin-top:12px; font-weight: bold;"></p>
    </div>

    <!-- Bức thư ẩn bên trong -->
    <div id="content">
        <div class="letter">
            <div class="letter-title">📜 THƯ GỬI HẢI TẶC</div>
            <p class="letter-text">
                Xin chào các bạn, những hải tặc thích phiêu lưu. Tuy đã giải được bí mật mà ta để lại nhưng mọi thứ vẫn chưa thật sự kết thúc!
            </p>
        </div>
    </div>

    <script>
        function check() {
            var v = document.getElementById("password").value;
            var pass = v.trim().toUpperCase(); 
            
            if (pass === "D7") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("content").style.display = "block";
                // Xóa ảnh nền hải tặc sau khi vào để đọc thư dễ hơn trên nền tối mượt
                document.body.style.background = "#0d1127"; 
            } else {
                document.getElementById("error").innerText = "❌ Tọa độ không chính xác!";
            }
        }
        
        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { check(); }
        });
    </script>
</body>
</html>
