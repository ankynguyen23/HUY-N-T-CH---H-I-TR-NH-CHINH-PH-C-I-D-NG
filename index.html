<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Trang web bảo mật</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #content { display: none; width: 100%; max-width: 600px; margin: 20px; }
        .letter { background: #f4ecd8; border: 2px solid #c3a37a; border-radius: 8px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .letter-title { font-size: 24px; color: #5c4033; margin-bottom: 25px; text-align: center; font-weight: bold; border-bottom: 2px dashed #c3a37a; padding-bottom: 10px; }
        .letter-text { font-size: 18px; color: #4a3525; line-height: 1.8; text-align: justify; font-style: italic; }
    </style>
</head>
<body>

    <!-- Màn hình khóa -->
    <div class="box" id="lock-screen">
        <h2>🔒 Nhập mật khẩu để vào</h2>
        <input type="text" id="password" placeholder="Mật khẩu là D7...">
        <button onclick="check()">Xác Thực</button>
        <p id="error" style="color:red; margin-top:10px;"></p>
    </div>

    <!-- Nội dung ẩn -->
    <div id="content">
        <div class="letter">
            <div class="letter-title">📜 THƯ GỬI HẢI TẶC</div>
            <p class="letter-text">
                Xin chào các bạn, những hải tặc thích phiêu lưu. Tuy đã giải được bí mật mà ta để lại nhưng mọi thứ vẫn chưa thật sự kết thúc!
            </p>
        </div>
    </div>

    <script>
        function check() {
            var v = document.getElementById("password").value;
            // Ép chữ thường thành chữ hoa và xóa khoảng trắng
            var pass = v.trim().toUpperCase(); 
            
            if (pass === "D7") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                document.getElementById("error").innerText = "Sai mật khẩu rồi!";
            }
        }
    </script>
</body>
</html>
