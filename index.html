<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web bảo mật</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; transition: all 0.3s ease; }
        h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; text-align: center; }
        input:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        #error { color: #dc3545; font-size: 14px; margin-top: 10px; min-height: 20px; }
        
        /* Giao diện bức thư ẩn */
        #content { display: none; width: 100%; max-width: 600px; margin: 20px; animation: fadeIn 1s ease-in-out; }
        .letter { background: #f4ecd8; border: 2px solid #c3a37a; border-radius: 8px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; }
        .letter::before { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 1px dashed #d9c5b2; pointer-events: none; }
        .letter-title { font-family: 'Georgia', serif; font-size: 24px; color: #5c4033; margin-bottom: 25px; text-align: center; font-weight: bold; border-bottom: 2px dashed #c3a37a; padding-bottom: 10px; }
        .letter-text { font-family: 'Georgia', serif; font-size: 18px; color: #4a3525; line-height: 1.8; text-align: justify; text-indent: 30px; font-style: italic; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Màn hình khóa -->
    <div class="box" id="lock-screen">
        <h2>🔒 Nội dung được bảo vệ</h2>
        <input type="password" id="password" placeholder="Nhập mật khẩu truy cập...">
        <button onclick="checkPassword()">Xác Thực</button>
        <p id="error"></p>
    </div>

    <!-- Nội dung ẩn hiện ra khi đúng mật khẩu -->
    <div id="content">
        <div class="letter">
            <div class="letter-title">📜 THƯ GỬI HẢI TẶC</div>
            <p class="letter-text">
                Xin chào các bạn, những hải tặc thích phiêu lưu. Tuy đã giải được bí mật mà ta để lại nhưng mọi thứ vẫn chưa thật sự kết thúc!
            </p>
        </div>
    </div>

    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const inputStyle = document.getElementById("password").value;
            const errorElement = document.getElementById("error");
            const hashedInput = await sha256(inputStyle);

            // Mật khẩu D7 đã được mã hóa an toàn
            const correctHash = "b25863c52e6462723c348f95c56b62ec54f49495f87b8fbe15e1bc978d302a90";

            if (hashedInput === correctHash) {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                errorElement.innerText = "❌ Mật khẩu không chính xác. Vui lòng thử lại!";
            }
        }

        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
